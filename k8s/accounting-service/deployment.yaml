apiVersion: apps/v1
kind: Deployment
metadata:
  name: accounting-service
  namespace: microservices
  labels:
    app: accounting-service
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: accounting-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: accounting-service
        tier: backend
    spec:
      containers:
        - name: accounting-service
          image: accounting-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          envFrom:
            - configMapRef:
                name: accounting-service-config
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
          volumeMounts:
            - name: image-storage
              mountPath: /app/storage/images
      volumes:
        - name: image-storage
          emptyDir: {}
