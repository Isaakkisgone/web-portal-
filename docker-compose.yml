services:
  accounting-service:
    build:
      context: ./accounting-service
      dockerfile: Dockerfile
    container_name: accounting-service
    ports:
      - "8081:8081"
    environment:
      - NODE_ENV=development
      - PORT=8081
      - LOG_LEVEL=debug
      - IMAGE_STORAGE_PATH=/app/storage/images
      - DEFAULT_IMAGE_URL=https://picsum.photos/400/300
      - IMAGE_DOWNLOAD_TIMEOUT_MS=15000
      - MAX_IMAGE_SIZE_BYTES=10485760
    volumes:
      - accounting_image_data:/app/storage/images
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  mobile-service:
    build:
      context: ./mobile-service
      dockerfile: Dockerfile
    container_name: mobile-service
    ports:
      - "8082:8082"
    environment:
      - NODE_ENV=development
      - PORT=8082
      - LOG_LEVEL=debug
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped

  web-portal:
    build:
      context: ./web-portal
      dockerfile: Dockerfile
    container_name: web-portal
    ports:
      - "5173:80"
    depends_on:
      - accounting-service
      - mobile-service
    networks:
      - microservices-net
    restart: unless-stopped

networks:
  microservices-net:
    driver: bridge

volumes:
  accounting_image_data:
    driver: local
